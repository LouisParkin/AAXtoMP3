name: tests

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: chapter and cover-art tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Report versions
        run: |
          bash --version | head -1
          jq --version
          sed --version | head -1

      - name: Syntax-check the shell scripts
        run: |
          bash -n AAXtoMP3
          bash -n interactiveAAXtoMP3
          bash -n tests/test-nested-chapters.sh
          bash -n openaudible/flatten-chapters

      - name: Syntax-check the Python tools
        run: |
          for f in openaudible/oa-* openaudible/openaudible-convert; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: Validate the shipped example data
        run: jq -e 'type == "object" and (length > 0)' openaudible/examples/*.json > /dev/null

      - name: Run the test suite
        run: ./tests/test-nested-chapters.sh

      - name: Smoke-test the CLI entry points
        run: |
          bash AAXtoMP3 --version
          bash AAXtoMP3 --help > /dev/null
          # no arguments must still be an error
          if bash AAXtoMP3 > /dev/null 2>&1; then
            echo "expected a non-zero exit with no arguments" >&2
            exit 1
          fi

      - name: Version constant must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          reported="$(bash AAXtoMP3 --version | head -1 | awk '{print $2}')"
          echo "tag=$tag reported=$reported"
          [ "$tag" = "$reported" ] || { echo "AAXTOMP3_VERSION does not match the tag" >&2; exit 1; }

  release:
    name: build and attach release archives
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the archives
        run: .github/scripts/build-archives.sh --version "${GITHUB_REF_NAME}" --out dist

      - name: Verify the archives
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          for a in *.tar.gz; do
            root="$(tar tzf "$a" | head -1)"
            [ "$root" = "AAXtoMP3-${GITHUB_REF_NAME}/" ] || { echo "$a has root $root" >&2; exit 1; }
          done
          # the packaged script must be executable and must run
          tar xzf "AAXtoMP3-${GITHUB_REF_NAME}-slim.tar.gz"
          "AAXtoMP3-${GITHUB_REF_NAME}/AAXtoMP3" --version

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/AAXtoMP3-*.tar.gz dist/AAXtoMP3-*.zip dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber
